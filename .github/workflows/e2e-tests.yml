name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config xvfb dbus-x11

    - name: Install nats-server
      run: |
        curl -sSL https://github.com/nats-io/nats-server/releases/download/v2.10.22/nats-server-v2.10.22-linux-amd64.tar.gz | tar xz -C /tmp
        sudo mv /tmp/nats-server-v2.10.22-linux-amd64/nats-server /usr/local/bin/nats-server
        nats-server --version

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      working-directory: frontend
      run: |
        bun install
        # 安装 Playwright 浏览器（如果需要）
        bunx playwright install --with-deps chromium

    - name: Build frontend
      working-directory: frontend
      run: bun run build

    - name: Start backend
      run: |
        cargo build --release -p ergatai-api --bin ergatai-server
        ./target/release/ergatai-server --port 3000 &
        # 等待后端就绪
        timeout=120
        while ! curl -s http://localhost:3000/health > /dev/null; do
          sleep 1
          timeout=$((timeout - 1))
          if [ $timeout -le 0 ]; then
            echo "Backend failed to start"
            exit 1
          fi
        done

    - name: Run E2E tests (Headless)
      working-directory: frontend
      env:
        # 默认就是 headless 模式，无需额外配置
        CI: true
      run: |
        xvfb-run -a bunx playwright test e2e-tests/tests/ipc/ \
          --reporter=html,line \
          --output=test-results

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          frontend/playwright-report/
          frontend/test-results/
        retention-days: 7

    - name: Upload test screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-screenshots
        path: frontend/test-results/**/*.png
        retention-days: 7