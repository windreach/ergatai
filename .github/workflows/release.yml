name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Windows is not supported yet: the lock IPC and terminal PTY layers
        # currently depend on Unix-only APIs.
        #
        # Build Linux on 22.04 so node-pty is linked against glibc 2.35
        # instead of the newest runner glibc (24.04/26.04).
        os: [ubuntu-22.04, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Cache Bun
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Build portable bundle
        shell: bash
        run: bash scripts/bundle.sh

      - name: Build desktop installers
        shell: bash
        # The frontend was already built by bundle.sh.
        env:
          # CI has no Developer ID certificate; produce unsigned macOS artifacts.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bash scripts/package.sh --skip-frontend

      - name: Verify Linux glibc baseline
        if: runner.os == 'Linux'
        shell: bash
        run: |
          max_glibc="$(
            find frontend/release -name 'pty.node' -o -name 'node-pty.node' \
              | while read -r file; do
                  objdump -T "$file" 2>/dev/null \
                    | grep -o 'GLIBC_[0-9.]*' \
                    | sort -V \
                    | tail -1
                done \
              | sort -V \
              | tail -1
          )"
          echo "node-pty max glibc symbol: ${max_glibc:-unknown}"
          if [[ -z "$max_glibc" ]]; then
            echo "ERROR: could not determine node-pty glibc requirement" >&2
            exit 1
          fi
          if [[ "$(printf '%s\n' "$max_glibc" 'GLIBC_2.35' | sort -V | tail -1)" != "GLIBC_2.35" ]]; then
            echo "ERROR: release now requires $max_glibc, expected <= GLIBC_2.35" >&2
            exit 1
          fi

      - name: Upload portable bundle
        uses: actions/upload-artifact@v4
        with:
          name: ergatai-portable-${{ matrix.os }}
          path: frontend/release/ergatai-portable-*.zip

      - name: Upload desktop installers
        uses: actions/upload-artifact@v4
        with:
          name: ergatai-installers-${{ matrix.os }}
          path: |
            frontend/release/*.AppImage
            frontend/release/*.deb
            frontend/release/*.dmg
            frontend/release/Ergatai-*.zip

  release:
    name: Publish GitHub Release
    needs: build
    # `workflow_dispatch` may run from a branch; a GitHub Release requires a tag.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          find artifacts -type f \
            \( -name 'ergatai-portable-*.zip' \
               -o -name '*.AppImage' \
               -o -name '*.deb' \
               -o -name '*.dmg' \
               -o -name 'Ergatai-*.zip' \) \
            -exec cp {} release-assets/ \;
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          ls -lh

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/ergatai-portable-*.zip
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/*.dmg
            release-assets/Ergatai-*.zip
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false