[package]
name = "ergatai-runtime"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["Ergatai Team"]
license = "Apache-2.0"
repository = "https://github.com/windreach/Ergatai"
description = "Pluggable agent runtime backends for Ergatai"

[dependencies]
ergatai-error = { path = "../ergatai-error" }
ergatai-lock = { path = "../ergatai-lock" }
agent-client-protocol.workspace = true
agent-client-protocol-http.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
percent-encoding.workspace = true
rusqlite.workspace = true
nix = { workspace = true, features = ["process"] }
parking_lot.workspace = true
libc.workspace = true
futures.workspace = true
which = "6.0"

[dev-dependencies]
tempfile.workspace = true
