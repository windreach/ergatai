[package]
name = "ergatai-runtime"
version = "0.1.0"
edition = "2021"
authors = ["Ergatai Team"]
license = "Apache-2.0"
repository = "https://github.com/windreach/Ergatai"
description = "Pluggable agent runtime backends for Ergatai"

[dependencies]
ergatai-error = { path = "../ergatai-error" }
ergatai-pty = { path = "../ergatai-pty" }
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
nix = { version = "0.27", features = ["signal", "process"] }
parking_lot = "0.12"

[dev-dependencies]
tempfile = "3.10"
