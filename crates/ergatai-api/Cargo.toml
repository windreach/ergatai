[package]
name = "ergatai-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "ergatai_api"
path = "src/lib.rs"

[[bin]]
name = "ergatai-server"
path = "src/main.rs"

[dependencies]
# Core library
ergatai-core = { path = "../ergatai-core" }
# NATS messaging
ergatai-nats = { path = "../ergatai-nats" }
# Error types
ergatai-error = { path = "../ergatai-error" }
# Agent runtime (PTY backend for agent workspace management)
ergatai-runtime = { path = "../ergatai-runtime" }
# File access control (locks, tokens)
ergatai-lock = { path = "../ergatai-lock" }

# ACP types for permission handler
agent-client-protocol.workspace = true
agent-client-protocol-rmcp.workspace = true

# NATS client (for message forwarding)
async-nats.workspace = true
futures.workspace = true

# Async
tokio.workspace = true
async-trait.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }

# Error handling
anyhow.workspace = true

# Database (for agent binding persistence)
rusqlite.workspace = true

# Logging
tracing.workspace = true

# CLI
clap.workspace = true

# MCP protocol (rmcp SDK)
# Using rmcp 2.x for both HTTP MCP and ACP MCP (unified version)
rmcp = { version = "2", features = ["server", "transport-streamable-http-server", "macros"] }
schemars = "1.0"
tokio-util.workspace = true

# HTTP server
axum.workspace = true
axum-server.workspace = true
tower-http.workspace = true

# Metrics (Prometheus)
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Utilities
uuid.workspace = true
chrono.workspace = true
percent-encoding.workspace = true
once_cell.workspace = true

[dev-dependencies]
http-body-util = "0.1"
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
serial_test = "3"
