[package]
name = "ergatai-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "ergatai_api"
path = "src/lib.rs"

[[bin]]
name = "ergatai-server"
path = "src/main.rs"

[dependencies]
# Core library
ergatai-core = { path = "../ergatai-core" }
# NATS messaging
ergatai-nats = { path = "../ergatai-nats" }
# Error types
ergatai-error = { path = "../ergatai-error" }
# Agent runtime (PTY backend for agent workspace management)
ergatai-runtime = { path = "../ergatai-runtime" }
# Binary locator (NATS server)
ergatai-binary = { path = "../ergatai-binary" }
# File access control (locks, tokens)
ergatai-lock = { path = "../ergatai-lock" }

# ACP types for permission handler
agent-client-protocol.workspace = true
agent-client-protocol-http.workspace = true
agent-client-protocol-rmcp.workspace = true

# NATS client (for message forwarding)
async-nats.workspace = true
futures = "0.3"

# Async
tokio.workspace = true
async-trait.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# Error handling
anyhow.workspace = true

# Database (for agent binding persistence)
rusqlite.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# CLI
clap.workspace = true

# MCP protocol (rmcp SDK)
# Note: We use two versions of rmcp:
# - rmcp 3.x for HTTP MCP server (existing implementation)
# - rmcp 2.x (as rmcp2) for ACP MCP integration (required by agent-client-protocol-rmcp)
rmcp = { version = "3", features = ["server", "transport-streamable-http-server", "macros", "elicitation"] }
rmcp2 = { package = "rmcp", version = "2", features = ["server", "macros"] }
schemars = "1.0"
tokio-util = "0.7"

# HTTP server
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }

# Metrics (Prometheus)
metrics = "0.24"
metrics-exporter-prometheus = "0.16"

# Utilities
uuid.workspace = true
chrono.workspace = true
once_cell = "1.19"

[dev-dependencies]
tokio-test = "0.4"
tower = { version = "0.5", features = ["util"] }
