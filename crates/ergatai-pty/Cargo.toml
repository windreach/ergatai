[package]
name = "ergatai-pty"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["Ergatai Team"]
license = "Apache-2.0"
repository = "https://github.com/windreach/Ergatai"
description = "PTY-based agent runtime for Ergatai — precise process control and output capture"

[dependencies]
ergatai-error = { path = "../ergatai-error" }
nix = { version = "0.27", features = ["term", "signal", "process", "fs"] }
vte = "0.13"
tokio = { version = "1.36", features = ["full", "net"] }
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3.10"
