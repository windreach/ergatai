[package]
name = "ergatai-lock"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["Ergatai Team"]
license = "Apache-2.0"
repository = "https://github.com/windreach/Ergatai"
description = "File access control and locking for Ergatai"

[dependencies]
ergatai-error = { path = "../ergatai-error" }
ergatai-nats = { path = "../ergatai-nats" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
rusqlite.workspace = true
async-nats.workspace = true
notify.workspace = true
sha2.workspace = true
git2.workspace = true
glob.workspace = true
futures-util.workspace = true
libc.workspace = true
tokio-util.workspace = true
parking_lot.workspace = true
async-trait.workspace = true

[features]
default = []
# Opt-in for integration tests that need root/CAP_SYS_ADMIN and fanotify support.
# Skipped by default in unprivileged CI.
fanotify-integration = []

[dev-dependencies]
tempfile.workspace = true
